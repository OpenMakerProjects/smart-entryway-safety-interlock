<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><title>ESP32 light qualification permission indicator and MQTT status</title><desc>USB powers ESP32. 3.3 V powers LDR divider and OLED. GPIO34 reads LDR and 10 kilohm junction; GPIO25 drives a green LED through 330 ohms. OLED SDA21 SCL22. All grounds common. MQTT broker is a software dependency, not a physical actuator.</desc><rect width="1100" height="650" fill="#fff"/><g font-family="sans-serif" font-size="19" fill="#182b3a"><rect x="410" y="170" width="240" height="300" rx="12" fill="#e5f1fa" stroke="#182b3a"/><text x="430" y="205">ESP32 DevKit</text><text x="430" y="245">3V3</text><text x="430" y="285">GPIO34 / ADC1</text><text x="430" y="325">GPIO25</text><text x="430" y="365">GPIO21 SDA</text><text x="430" y="405">GPIO22 SCL</text><text x="430" y="445">GND</text><rect x="770" y="320" width="260" height="150" fill="#e5f1fa" stroke="#182b3a"/><text x="790" y="350">SSD1306 OLED 0x3C</text><text x="790" y="385">SDA / SCL</text><text x="790" y="420">VCC 3.3 V / GND</text><text x="50" y="190">3.3 V</text><text x="70" y="235">LDR</text><text x="65" y="320">10 kΩ</text><text x="65" y="380">GND</text><text x="750" y="175">330 Ω → green LED A</text><text x="750" y="205">LED K → common GND</text><text x="405" y="120">USB 5 V input → onboard regulator</text><text x="50" y="535">GPIO25 HIGH = educational permission indication only; no actuator connected.</text><text x="50" y="575">Wi-Fi → private MQTT broker :1883 → guard19/command and guard19/state</text><text x="50" y="615">All GPIO signals ≤3.3 V. No mains, locks, machinery or certified safety function.</text></g><g fill="none" stroke="#176787" stroke-width="3"><path d="M 410 240 H 200 V 180 H 120 V 210"/><rect x="105" y="210" width="30" height="40"/><path d="M 120 250 V 280 H 410"/><circle cx="120" cy="280" r="5" fill="#176787"/><path d="M 120 280 V 300"/><rect x="105" y="300" width="30" height="40"/><path d="M 120 340 V 440 H 410"/><path d="M 650 320 H 730 V 155 H 1040 V 235 H 710 V 440 H 650"/><rect x="850" y="140" width="65" height="30"/><path d="M 950 140 L 980 155 L 950 170 Z M 980 137 V 173"/><path d="M 650 360 H 770 M 650 400 H 770 M 650 240 H 1060 V 415 H 1030 M 650 440 H 770"/></g></svg>